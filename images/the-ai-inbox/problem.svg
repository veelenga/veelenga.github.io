<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fafafa;">
  <defs>
    <marker id="pr-slate" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#5A6B78"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#2b3640">One thought, two ways to lose it</text>

  <!-- the thought -->
  <text x="112" y="166" text-anchor="middle" font-size="11.5" fill="#76828c">a new thought</text>
  <g transform="translate(112,220) rotate(-3)">
    <rect x="-62" y="-32" width="124" height="64" rx="4" fill="#FFFCF2" stroke="#D6A22E" stroke-width="1.5"/>
    <rect x="-14" y="-37" width="28" height="9" fill="#F3DFA8"/>
    <text y="-3" text-anchor="middle" font-size="13" font-style="italic" fill="#6b5310">idea after</text>
    <text y="15" text-anchor="middle" font-size="13" font-style="italic" fill="#6b5310">the meeting</text>
  </g>

  <!-- fork -->
  <g stroke="#5A6B78" stroke-width="2" fill="none">
    <path d="M178,208 C238,208 238,130 302,130" marker-end="url(#pr-slate)"/>
    <path d="M178,232 C238,232 238,310 302,310" marker-end="url(#pr-slate)"/>
  </g>
  <text x="236" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#41525E">organize it now</text>
  <text x="236" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#41525E">organize it later</text>

  <!-- top path: a form for every thought -->
  <g>
    <rect x="310" y="70" width="200" height="120" rx="10" fill="#fff" stroke="#AEB7BF" stroke-width="1.5"/>
    <text x="326" y="93" font-size="12.5" font-weight="700" fill="#2b3640">New note</text>
    <rect x="446" y="80" width="50" height="18" rx="9" fill="#F1F3F5"/>
    <circle cx="459" cy="89" r="5" fill="none" stroke="#76828c" stroke-width="1.2"/>
    <path d="M459,86 L459,89 L461,90.5" fill="none" stroke="#76828c" stroke-width="1.2" stroke-linecap="round"/>
    <text x="468" y="93" font-size="10.5" fill="#76828c">2 min</text>

    <g font-size="11" fill="#76828c">
      <text x="326" y="118">Title</text>
      <text x="326" y="146">Folder</text>
      <text x="326" y="174">Tags</text>
    </g>
    <g fill="#fff" stroke="#cfd6dc" stroke-width="1.2">
      <rect x="370" y="105" width="126" height="18" rx="3"/>
      <rect x="370" y="133" width="126" height="18" rx="3"/>
      <rect x="370" y="161" width="126" height="18" rx="3"/>
    </g>
    <line x1="376" y1="109" x2="376" y2="119" stroke="#5A6B78" stroke-width="1.2"/>
    <path d="M482,140 L490,140 L486,145 z" fill="#76828c"/>
    <text x="378" y="174" font-size="10" fill="#9aa4ac">+ add tag</text>
  </g>

  <!-- bottom path: the junk drawer -->
  <g>
    <rect x="310" y="250" width="200" height="120" rx="10" fill="#FFF6E0" stroke="#D6A22E" stroke-width="1.5"/>
    <text x="326" y="272" font-size="12.5" font-weight="700" fill="#8a6a14">Inbox</text>
    <text x="496" y="272" text-anchor="end" font-size="10.5" fill="#8a6a14">347 items</text>
    <g font-size="9" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#6b5310" text-anchor="middle">
      <g transform="translate(352,302) rotate(-8)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">call bob</text></g>
      <g transform="translate(410,297) rotate(6)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">link</text></g>
      <g transform="translate(468,303) rotate(-4)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">idea: …</text></g>
      <g transform="translate(348,327) rotate(5)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">re: q4</text></g>
      <g transform="translate(406,323) rotate(-10)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">todo??</text></g>
      <g transform="translate(466,330) rotate(8)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">fri!</text></g>
      <g transform="translate(356,351) rotate(-3)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">buy</text></g>
      <g transform="translate(418,349) rotate(4)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">notes 2</text></g>
      <g transform="translate(474,352) rotate(-7)"><rect x="-29" y="-10" width="58" height="20" rx="2" fill="#FFFCF2" stroke="#D6A22E"/><text y="3">???</text></g>
    </g>
  </g>

  <!-- to the dead ends -->
  <g stroke="#5A6B78" stroke-width="2" fill="none">
    <line x1="510" y1="130" x2="600" y2="130" marker-end="url(#pr-slate)"/>
    <line x1="510" y1="310" x2="600" y2="310" marker-end="url(#pr-slate)"/>
  </g>
  <text x="556" y="121" text-anchor="middle" font-size="11" fill="#76828c">too slow</text>
  <text x="556" y="301" text-anchor="middle" font-size="11" fill="#76828c">never happens</text>

  <!-- dead end 1 -->
  <g>
    <rect x="612" y="92" width="250" height="76" rx="12" fill="#FBEAE6" stroke="#C8553D" stroke-width="1.6"/>
    <circle cx="650" cy="130" r="17" fill="#fff" stroke="#C8553D" stroke-width="1.8"/>
    <g transform="translate(650,130) rotate(-45)">
      <rect x="-9" y="-3.5" width="15" height="7" fill="#fff" stroke="#9b3b28" stroke-width="1.4"/>
      <rect x="-12" y="-3.5" width="3" height="7" fill="#9b3b28"/>
      <path d="M6,-3.5 L11.5,0 L6,3.5 z" fill="#9b3b28"/>
    </g>
    <line x1="638" y1="118" x2="662" y2="142" stroke="#C8553D" stroke-width="2"/>
    <text x="682" y="125" font-size="14" font-weight="700" fill="#9b3b28">We stop writing</text>
    <text x="682" y="144" font-size="14" font-weight="700" fill="#9b3b28">things down</text>
  </g>

  <!-- dead end 2 -->
  <g>
    <rect x="612" y="272" width="250" height="76" rx="12" fill="#FBEAE6" stroke="#C8553D" stroke-width="1.6"/>
    <circle cx="646" cy="305" r="12" fill="#fff" stroke="#C8553D" stroke-width="2.2"/>
    <line x1="655" y1="314" x2="664" y2="323" stroke="#C8553D" stroke-width="3.5" stroke-linecap="round"/>
    <text x="646" y="309.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9b3b28">?</text>
    <text x="682" y="305" font-size="14" font-weight="700" fill="#9b3b28">Nothing in it</text>
    <text x="682" y="324" font-size="14" font-weight="700" fill="#9b3b28">can be found</text>
  </g>

  <text x="450" y="405" text-anchor="middle" font-size="13.5" fill="#41525E">Capturing wants speed. Organizing wants time and context. One moment can't give both.</text>
</svg>
